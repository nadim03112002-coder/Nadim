name: Build SCHOOL+ Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SCHOOL+ APK & Play Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject optional google-services.json secret
        if: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
        env:
          GS_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GS_JSON" > android/app/google-services.json

      - name: Decode optional Release Keystore secret
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > android/app/keystore.jks

      - name: Build Signed Release APK & AAB (when Keystore secret is present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SCHOOL-PLUS.apk
          cp app/build/outputs/bundle/release/app-release.aab SCHOOL-PLUS.aab

      - name: Build Debug APK (default when no Release Keystore secret)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SCHOOL-PLUS.apk

      - name: Upload SCHOOL-PLUS.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCHOOL-PLUS-Android-APK
          path: |
            android/SCHOOL-PLUS.apk
            android/SCHOOL-PLUS.aab
          if-no-files-found: warn
          retention-days: 30
