name: Build SCHOOL+ Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build SCHOOL+ APK & Play Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare optional Firebase & Keystore secrets
        env:
          GS_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            echo "Injected android/app/google-services.json"
          else
            echo "No ANDROID_GOOGLE_SERVICES_JSON secret found — skipping optional FCM config"
          fi

          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > android/app/keystore.jks
            echo "Decoded android/app/keystore.jks"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found — will build Debug APK"
          fi

      - name: Build SCHOOL+ APK (Release or Debug)
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$KS_B64" ] && [ -f app/keystore.jks ]; then
            gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk SCHOOL-PLUS.apk
            cp app/build/outputs/bundle/release/app-release.aab SCHOOL-PLUS.aab
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk SCHOOL-PLUS.apk
          fi

      - name: Upload SCHOOL-PLUS.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCHOOL-PLUS-Android-APK
          path: android/SCHOOL-PLUS.*
          if-no-files-found: error
          retention-days: 30
