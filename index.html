<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Static (pre-JS) theming so browser chrome, website-to-APK/TWA wrappers,
         and the OS status/navigation bar are themed correctly from first paint.
         Keep in sync with the manifest theme_color/background_color in vite.config.ts
         and with the dynamic theme-color updates in StudentDashboard.tsx. -->
    <meta name="theme-color" content="#121212" />
    <meta name="background-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCHOOL+" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=3" />
    <title>SCHOOL+ – Official School Portal &amp; ERP</title>
    <meta name="description" content="SCHOOL+ Official Digital Campus — Online Admission, Fee Passbook, Live Attendance, Exam Results &amp; Smart Learning." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SCHOOL+ – Official School Portal &amp; ERP" />
    <meta property="og:description" content="SCHOOL+ Official Digital Campus — Online Admission, Fee Passbook, Live Attendance, Exam Results &amp; Smart Learning." />
    <meta property="og:site_name" content="SCHOOL+" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SCHOOL+ – Official School Portal &amp; ERP" />
    <meta name="twitter:description" content="SCHOOL+ Official Digital Campus — Online Admission, Fee Passbook, Live Attendance, Exam Results &amp; Smart Learning." />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <link rel="manifest" href="/api/manifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Start the app splash clock before the React bundle begins loading.
      // The HTML fallback below covers the gap between the native PWA splash
      // and React mounting without introducing a blank frame.
      window.__nstaBootStartedAt = Date.now();

      // Suppress cross-origin opaque script errors and Vite dev-server HMR / WebSocket connection errors
      function isIgnoredError(msg) {
        if (!msg) return true;
        var s = String(msg);
        return s === 'Script error.' ||
               s === 'Script error' ||
               s.indexOf('send was called before connect') !== -1 ||
               s.indexOf('WebSocket') !== -1 ||
               s.indexOf('vite') !== -1 ||
               s.indexOf('AbortError') !== -1;
      }
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (!event.error && (msg === 'Script error.' || msg === 'Script error' || !msg)) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
        if (isIgnoredError(msg)) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.onerror = function(msg, url, line, col, error) {
        var errMsg = msg || (error && error.message);
        if (isIgnoredError(errMsg)) {
          return true;
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        if (isIgnoredError(msg)) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
    <style>
      #pre-react-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        width: 100vw;
        height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 4rem 1.5rem 3rem;
        overflow: hidden;
        color: #e2e8f0;
        font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
        user-select: none;
        background: radial-gradient(circle at 50% 24%, #172554 0%, #090d26 48%, #020617 100%);
        background-color: #020617;
      }
      #pre-react-splash::before {
        content: "";
        position: absolute;
        top: 24%;
        left: 50%;
        width: 28rem;
        height: 20rem;
        border-radius: 999px;
        pointer-events: none;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(56, 189, 248, .18) 0%, rgba(245, 158, 11, .14) 45%, transparent 70%);
        filter: blur(55px);
      }
      .pre-react-splash-brand,
      .pre-react-splash-footer {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .pre-react-splash-brand {
        margin-top: auto;
        margin-bottom: auto;
      }
      .pre-react-wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
      }
      .pre-react-char {
        display: inline-block;
        font-size: clamp(2.4rem, 11vw, 3.75rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #f8fafc;
        opacity: 0;
        animation: preReactCharIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .pre-react-char:nth-child(1) { animation-delay: 0ms; }
      .pre-react-char:nth-child(2) { animation-delay: 50ms; }
      .pre-react-char:nth-child(3) { animation-delay: 100ms; }
      .pre-react-char:nth-child(4) { animation-delay: 150ms; }
      .pre-react-char:nth-child(5) { animation-delay: 200ms; }
      .pre-react-char:nth-child(6) { animation-delay: 250ms; }
      .pre-react-plus {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: clamp(2.4rem, 10vw, 3.25rem);
        height: clamp(2.4rem, 10vw, 3.25rem);
        margin-left: 0.25rem;
        border-radius: 0.9rem;
        background: linear-gradient(135deg, #fcd34d, #f59e0b, #ea580c);
        color: #020617;
        font-size: clamp(1.9rem, 8vw, 2.75rem);
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.55);
        opacity: 0;
        animation: preReactPlusPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 310ms forwards;
      }
      .pre-react-splash-subtitle {
        margin: .9rem 0 0;
        color: #7dd3fc;
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .2em;
        text-transform: uppercase;
      }
      .pre-react-splash-footer {
        gap: .65rem;
        width: 100%;
        max-width: 14rem;
      }
      .pre-react-bar-track {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .pre-react-bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #38bdf8, #fde047, #f59e0b);
        animation: preReactSlideBar 1.05s ease-in-out infinite;
      }
      .pre-react-splash-starting {
        display: flex;
        align-items: center;
        gap: .5rem;
        color: #94a3b8;
        font-size: .75rem;
        font-weight: 600;
      }
      .pre-react-splash-dot {
        width: .5rem;
        height: .5rem;
        border-radius: 999px;
        background: #fbbf24;
        animation: pre-react-splash-pulse 1.5s infinite;
      }
      .pre-react-splash-version {
        color: #64748b;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .625rem;
      }
      @keyframes pre-react-splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .45; transform: scale(.75); }
      }
      @keyframes preReactCharIn {
        0% { opacity: 0; transform: translateY(22px) scale(0.8); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes preReactPlusPop {
        0% { opacity: 0; transform: scale(0.3) rotate(-60deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      @keyframes preReactSlideBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body style="margin:0;background-color:#020617;">
    <div id="root">
    </div>
    <div id="pre-react-splash" aria-hidden="true">
      <div class="pre-react-splash-brand">
        <div class="pre-react-wordmark" aria-label="SCHOOL+">
          <span class="pre-react-char">S</span>
          <span class="pre-react-char">C</span>
          <span class="pre-react-char">H</span>
          <span class="pre-react-char">O</span>
          <span class="pre-react-char">O</span>
          <span class="pre-react-char">L</span>
          <span class="pre-react-plus">+</span>
        </div>
        <p class="pre-react-splash-subtitle">Smart School ERP · Learn · Grow</p>
        <img
          src="/branding/schoolplus-splash-logo.png"
          alt="SCHOOL+"
          style="width:124px;height:124px;margin-top:20px;border-radius:26px;object-fit:contain;box-shadow:0 14px 34px rgba(245,158,11,0.22);"
        />
      </div>
      <div class="pre-react-splash-footer">
        <div class="pre-react-bar-track"><div class="pre-react-bar-fill"></div></div>
        <div class="pre-react-splash-starting">
          <span class="pre-react-splash-dot"></span>
          <span>Starting SCHOOL+...</span>
        </div>
        <span class="pre-react-splash-version">SCHOOL+</span>
      </div>
    </div>
    <script>
      window.__nstaReactMounted = false;
      window.hidePreReactSplash = function() {
        if (window.__nstaReactMounted) return;
        window.__nstaReactMounted = true;
        try {
          document.body.style.background = '';
          document.body.style.backgroundColor = '';
        } catch(e) {}
        const splash = document.getElementById('pre-react-splash');
        if (splash) {
          splash.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
          splash.style.opacity = '0';
          splash.style.transform = 'scale(0.98)';
          setTimeout(function() {
            try { splash.remove(); } catch(e) {}
          }, 320);
        }
      };

      // Guaranteed auto-hide timeout: dismiss splash after 1.2s so user never gets stuck
      setTimeout(function() {
        if (window.hidePreReactSplash) window.hidePreReactSplash();
      }, 1200);

      if (document.readyState === 'complete') {
        setTimeout(window.hidePreReactSplash, 400);
      } else {
        window.addEventListener('load', function() {
          setTimeout(window.hidePreReactSplash, 400);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
